{% extends 'base.html' %}

{% block title %}Multiple Image Compression{% endblock %}

{% block content %}
<section class="compression-section">
    <h1>Multiple Image Compression</h1>
    <p>Select multiple images to compress and preview them before downloading.</p>

    <form id="multiUploadForm" enctype="multipart/form-data">
        <input type="file" id="multiImages" name="images" accept="image/*" multiple required>
        <label for="multiQuality">Select Compression Quality:</label>
        <select id="multiQuality" name="quality">
            <option value="25">High Compression (25%)</option>
            <option value="50" selected>Medium Compression (50%)</option>
            <option value="75">Low Compression (75%)</option>
        </select>
        <button type="submit" class="btn">Compress Images</button>
    </form>

    <div id="previewContainer"></div>

    <div id="multiResult" class="result hidden">
        <p>Compression successful! Download your images below:</p>
        <div id="compressedImages"></div>
    </div>
</section>

<script>
    document.getElementById("multiImages").addEventListener("change", function(event) {
        let previewContainer = document.getElementById("previewContainer");
        previewContainer.innerHTML = "";
        let files = event.target.files;

        Array.from(files).forEach(file => {
            let reader = new FileReader();
            reader.onload = function(e) {
                let img = document.createElement("img");
                img.src = e.target.result;
                img.style.width = "150px";
                img.style.margin = "10px";
                previewContainer.appendChild(img);
            };
            reader.readAsDataURL(file);
        });
    });

    document.getElementById("multiUploadForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        let formData = new FormData();
        let files = document.getElementById("multiImages").files;
        let quality = document.getElementById("multiQuality").value;

        for (let file of files) {
            formData.append("images", file);
        }
        formData.append("quality", quality);

        let response = await fetch("/compress/multiple", {
            method: "POST",
            body: formData
        });

        let result = await response.json();
        if (result.success) {
            document.getElementById("multiResult").classList.remove("hidden");
            let compressedImagesDiv = document.getElementById("compressedImages");
            compressedImagesDiv.innerHTML = "";

            result.images.forEach(imageUrl => {
                let img = document.createElement("img");
                img.src = imageUrl;
                img.style.width = "150px";
                img.style.margin = "10px";

                let downloadLink = document.createElement("a");
                downloadLink.href = imageUrl;
                downloadLink.download = imageUrl.split("/").pop();
                downloadLink.textContent = "Download";
                downloadLink.style.display = "block";

                let container = document.createElement("div");
                container.appendChild(img);
                container.appendChild(downloadLink);

                compressedImagesDiv.appendChild(container);
            });
        } else {
            alert("Compression failed! Please try again.");
        }
    });
</script>
{% endblock %}
